name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The docs' vocabulary rules (scripts/docs-lint.ts): em dashes, retired token
      # words, internal round IDs and decision jargon fail the deploy so a stale
      # phrase cannot ship to the site or the repo docs.
      - run: npm run docs:lint

      # Bundles the engine + demo and generates the token CSS into dist/.
      - run: npm run demo:build

      # Builds the public Figma plugin. It is NO LONGER PUBLISHED (owner 2026-07-29 —
      # see the packaging step below), but the build stays in CI: it bundles the engine,
      # so a compile break here is a real break, and the collapse plan requires the
      # public plugin to keep compiling even while it carries no migration table.
      - run: npm run plugin:build

      # Builds plugin v2 (extended collections, unlisted for now) — zipped below
      # beside v1 so an Enterprise seat can install it by download alone.
      - run: npm run plugin-ext:build

      # Builds the Mapper (Unify -> okchroma converter, stage 1 = inspect) — zipped
      # below, reachable only via the quiet "mapper" link on the install page.
      - run: npm run plugin-unify:build

      # The demo entry (demo/index.html) references ../dist and ../tokens.
      # Flatten into a Pages root: index.html at top, assets beside it, with
      # the ../ rewritten to plain relative paths so it works under the
      # /okchroma/ project subpath.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r dist _site/dist
          cp -r tokens _site/tokens
          cp demo/favicon.png _site/favicon.png
          sed 's#\.\./dist/#dist/#g; s#\.\./tokens/#tokens/#g' demo/index.html > _site/index.html

      # Manual install: /install.html + /okchroma-extended.zip. The page is the ONLY way
      # in — nothing in the demo links to it (the extended plugin is unlisted), so the
      # URL is what gets shared. The zip unpacks to ONE folder holding exactly what
      # Figma's "Import plugin from manifest" needs — manifest.json beside its dist/.
      #
      # THE PUBLIC PLUGIN'S ZIP IS NOT PUBLISHED (owner 2026-07-29): the 2026-07-29
      # highlight collapse (CATALOG C33) changed the token shape — highlight-9 and
      # on-highlight deleted, every ink name renumbered down — and `plugin/` ships
      # WITHOUT the RENAMED_LEAVES entries that migrate a Figma file across it, so a
      # re-download would leave someone's variables pointing at names that are gone.
      # It still BUILDS above; it just does not ship. Restoring it means writing the
      # migration table first (collapse plan, phase 4), not re-adding a cp line.
      # install.html lives in plugin-ext/ because it documents THAT plugin — it was
      # plugin/install.html when the public one was the subject.
      - name: Package the extended plugin for manual install
        run: |
          mkdir -p stage/okchroma-extended/dist
          cp plugin-ext/manifest.json stage/okchroma-extended/
          cp plugin-ext/dist/plugin-ext-code.js plugin-ext/dist/plugin-ext-ui.html stage/okchroma-extended/dist/
          (cd stage && zip -rq ../_site/okchroma-extended.zip okchroma-extended)
          cp plugin-ext/install.html _site/install.html

      # The Mapper's zip, same import-from-manifest shape. Unadvertised: only the
      # "mapper" link at the bottom corner of install.html points here.
      - name: Package the Mapper for manual install
        run: |
          mkdir -p stage/okchroma-mapper/dist
          cp plugin-unify/manifest.json stage/okchroma-mapper/
          cp plugin-unify/dist/plugin-unify-code.js plugin-unify/dist/plugin-unify-ui.html stage/okchroma-mapper/dist/
          (cd stage && zip -rq ../_site/okchroma-mapper.zip okchroma-mapper)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
