<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: 12px;
  color: #1a1a1a;
  background: #fff;
  padding: 16px;
  line-height: 1.45;
  user-select: none;
}

.label {
  font-size: 11px;
  font-weight: 600;
  color: #888;
  text-transform: uppercase;
  letter-spacing: .4px;
  margin-bottom: 6px;
}
.section { margin-bottom: 14px; }

h1 { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.sub { color: #888; font-size: 11.5px; margin-bottom: 14px; }

.scope-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1.5px solid #d9d9de; border-radius: 8px; overflow: hidden; }
.seg button {
  border: none; background: #fff; padding: 6px 12px; font: inherit; font-weight: 550;
  color: #666; cursor: pointer; border-right: 1px solid #e7e7ea;
}
.seg button:last-child { border-right: none; }
.seg button.on { background: #7c6fcd; color: #fff; }
.btn {
  border: none; border-radius: 8px; background: #7c6fcd; color: #fff;
  font: inherit; font-weight: 650; padding: 7px 16px; cursor: pointer;
}
.btn:disabled { opacity: .5; cursor: default; }
.btn.quiet { background: #f0eef9; color: #5d51a8; }

.status { color: #888; font-size: 11.5px; min-height: 16px; margin-bottom: 10px; }
.status.err { color: #d13438; }

.summary { display: flex; gap: 14px; color: #666; margin-bottom: 10px; flex-wrap: wrap; }
.summary b { color: #1a1a1a; }

/* token buckets */
.trow { border: 1px solid #ececef; border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.thead { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #fafafb; border-bottom: 1px solid #ececef; }
.tname { font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.usw { width: 18px; height: 18px; border-radius: 5px; border: 1px solid rgba(0,0,0,.12); flex-shrink: 0; }
.count { color: #888; font-weight: 650; flex-shrink: 0; }
.tag { font-size: 10px; font-weight: 700; border-radius: 4px; padding: 2px 6px; flex-shrink: 0; }
.tag.sug { background: #fdf1e2; color: #a05a00; }
.tag.miss { background: #fdeaea; color: #b3373b; }

/* clusters: kind · ancestor · count · select · chips · apply */
.cluster {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  border-bottom: 1px solid #f2f2f4; flex-wrap: wrap;
}
.cluster:last-child { border-bottom: none; }
.ck { font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; width: 42px; flex-shrink: 0; }
.ca { font-weight: 600; color: #444; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cn { color: #999; font-weight: 650; flex-shrink: 0; }
.cluster .sel {
  border: none; background: none; color: #5d51a8; font: inherit; font-size: 11px;
  font-weight: 650; cursor: pointer; padding: 2px 4px; flex-shrink: 0;
}
.chips { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; min-width: 180px; }
.okchip {
  display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 10.5px;
  font-weight: 600; color: #555; background: #f6f6f8; border: 1.5px solid transparent;
  border-radius: 6px; padding: 3px 7px 3px 4px; cursor: pointer;
}
.okchip.sel { border-color: #7c6fcd; background: #f0eef9; color: #3d3186; }
.okchip.miss { opacity: .45; cursor: default; padding-left: 7px; }
.okchip .pair { display: inline-flex; border-radius: 4px; overflow: hidden; border: 1px solid rgba(0,0,0,.12); }
.okchip .pair span { width: 11px; height: 14px; display: inline-block; }
.cluster .apply {
  border: none; border-radius: 6px; background: #7c6fcd; color: #fff; font: inherit;
  font-size: 11px; font-weight: 650; padding: 4px 12px; cursor: pointer; flex-shrink: 0;
}
.cluster .apply:disabled { opacity: .35; cursor: default; }

.rest { color: #999; font-size: 11.5px; padding: 4px 2px; }
.empty { color: #999; padding: 10px; }

textarea#report-buf { position: fixed; left: -9999px; top: 0; }
</style>
</head>
<body>
  <h1>OKChroma Mapper</h1>
  <div class="sub">Unify → okchroma, cluster by cluster — nothing applies until you pick and hit Apply</div>

  <div class="scope-row">
    <div class="seg" id="scope-seg">
      <button data-scope="selection">Selection</button>
      <button data-scope="page" class="on">Page</button>
      <button data-scope="file">File</button>
    </div>
    <button class="btn" id="scan-btn">Scan</button>
    <button class="btn" id="apply-all-btn" disabled>Apply all picked</button>
    <button class="btn quiet" id="copy-btn" disabled>Copy report</button>
  </div>
  <div class="status" id="status">Pick a scope and scan.</div>

  <div id="results" style="display:none">
    <div class="summary" id="summary"></div>

    <div class="section">
      <div class="label">Matched tokens — groups of similar elements</div>
      <div id="matched-rows"></div>
    </div>

    <div class="rest" id="rest-rows"></div>
  </div>

  <textarea id="report-buf" tabindex="-1" aria-hidden="true"></textarea>

<script>__BUNDLE__</script>
</body>
</html>
