<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: 12px;
  color: #1a1a1a;
  background: #fff;
  padding: 16px;
  line-height: 1.45;
  user-select: none;
}

.label {
  font-size: 11px;
  font-weight: 600;
  color: #888;
  text-transform: uppercase;
  letter-spacing: .4px;
  margin-bottom: 6px;
}
.section { margin-bottom: 14px; }

h1 { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.sub { color: #888; font-size: 11.5px; margin-bottom: 14px; }

/* scope segmented control + scan */
.scope-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1.5px solid #d9d9de; border-radius: 8px; overflow: hidden; }
.seg button {
  border: none; background: #fff; padding: 6px 12px; font: inherit; font-weight: 550;
  color: #666; cursor: pointer; border-right: 1px solid #e7e7ea;
}
.seg button:last-child { border-right: none; }
.seg button.on { background: #7c6fcd; color: #fff; }
.btn {
  border: none; border-radius: 8px; background: #7c6fcd; color: #fff;
  font: inherit; font-weight: 650; padding: 7px 16px; cursor: pointer;
}
.btn:disabled { opacity: .5; cursor: default; }
.btn.quiet { background: #f0eef9; color: #5d51a8; }

.status { color: #888; font-size: 11.5px; min-height: 16px; margin-bottom: 10px; }
.status.err { color: #d13438; }

/* result rows (Organizer-style anatomy: swatch/name + chips + count, expandable) */
.rows { border: 1px solid #ececef; border-radius: 10px; overflow: hidden; }
.row { border-bottom: 1px solid #ececef; }
.row:last-child { border-bottom: none; }
.row-head {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer;
}
.row-head:hover { background: #fafafb; }
.row-name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag {
  font-size: 10px; font-weight: 700; letter-spacing: .3px; border-radius: 4px;
  padding: 2px 6px; flex-shrink: 0;
}
.tag.lib { background: #eef2fb; color: #3b5bad; }
.tag.unify { background: #fdf1e2; color: #a05a00; }
.tag.coll { background: #f2f2f4; color: #777; font-weight: 600; letter-spacing: 0; }
.count { color: #888; font-weight: 650; flex-shrink: 0; }
.sw { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(0,0,0,.12); flex-shrink: 0; }

.row-body { display: none; padding: 4px 10px 10px 34px; }
.row.open .row-body { display: block; }
.usage-line { display: flex; align-items: center; gap: 8px; color: #666; padding: 2px 0; }
.usage-line .k { color: #999; font-size: 10.5px; width: 44px; flex-shrink: 0; }
.usage-line .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sel {
  border: none; background: none; color: #5d51a8; font: inherit; font-size: 11px;
  font-weight: 650; cursor: pointer; padding: 2px 4px; flex-shrink: 0;
}
.more { color: #aaa; font-size: 11px; padding: 2px 0; }

.summary { display: flex; gap: 14px; color: #666; margin-bottom: 10px; flex-wrap: wrap; }
.summary b { color: #1a1a1a; }

textarea#report-buf { position: fixed; left: -9999px; top: 0; }
</style>
</head>
<body>
  <h1>OKChroma Mapper</h1>
  <div class="sub">Inventory of color bindings — inspect only, nothing is changed</div>

  <div class="scope-row">
    <div class="seg" id="scope-seg">
      <button data-scope="selection">Selection</button>
      <button data-scope="page" class="on">Page</button>
      <button data-scope="file">File</button>
    </div>
    <button class="btn" id="scan-btn">Scan</button>
    <button class="btn quiet" id="copy-btn" disabled>Copy report</button>
  </div>
  <div class="status" id="status">Pick a scope and scan.</div>

  <div id="results" style="display:none">
    <div class="summary" id="summary"></div>

    <div class="section">
      <div class="label">Bound color variables</div>
      <div class="rows" id="bound-rows"></div>
    </div>

    <div class="section">
      <div class="label">Detached solid fills</div>
      <div class="rows" id="detached-rows"></div>
    </div>
  </div>

  <textarea id="report-buf" tabindex="-1" aria-hidden="true"></textarea>

<script>__BUNDLE__</script>
</body>
</html>
